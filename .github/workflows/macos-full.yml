name: Native macOS Full candidate

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-full-validation]

permissions:
  contents: read

jobs:
  fetch-resources:
    name: Fetch reviewed draft resources
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Draft releases are visible only with push access. No release mutation occurs.
    # 草稿下载需要 push 权限；写权限仅限此资源获取 job，不传入原生构建。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download and verify exact locked draft asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_macos_full.py --fetch-assets "$RUNNER_TEMP/full-assets.whl"
      - uses: actions/upload-artifact@v5
        with:
          name: reviewed-macos-full-resources-${{ github.run_id }}
          path: ${{ runner.temp }}/full-assets.whl
          if-no-files-found: error
          retention-days: 3

  native-full:
    name: Full / ${{ matrix.arch }}
    needs: fetch-resources
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Receive this run's verified resources
        uses: actions/download-artifact@v6
        with:
          name: reviewed-macos-full-resources-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Prepare pinned native Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build native Full app and portable archive
        run: python scripts/build_macos_full.py --wheel "$RUNNER_TEMP/full-assets.whl" --execute
      - name: Install external validation packages
        run: python -m pip install 'numpy>=2,<3' 'astropy>=6,<8'
      - name: Validate packaged CLI, real FITS, server and worker shutdown
        run: python scripts/verify_macos_full.py --package dist/macos --output reports/macos --probe-gui
      - name: Upload validated candidate and evidence
        uses: actions/upload-artifact@v5
        with:
          name: fitsviewer-full-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/macos/*.zip
            dist/macos/*.sha256
            dist/macos/package.json
            reports/macos/
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fitsviewer-macos-failure-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            dist/macos/build.json
            reports/macos/
