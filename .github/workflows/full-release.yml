name: Full 0.1.7 platform candidates

on:
  push:
    branches: [codex/v0.1.7-release]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.99.1'
  CARGO_INCREMENTAL: '0'

jobs:
  shared:
    name: Full shared WASM and Lab resources
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: jupyter/package-lock.json
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/.crates*
            target/wasm32-unknown-unknown
            target/release
          key: full-shared-v1-rust1.99.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'vendor/**', 'web/locales/**') }}
          restore-keys: full-shared-v1-rust1.99.1-
      - name: Build once from this commit and lock every resource
        run: python scripts/build_ci_resources.py --execute --output "$RUNNER_TEMP/ci-resources"
      - uses: actions/upload-artifact@v5
        with:
          name: full-shared-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-resources/*.whl
            ${{ runner.temp }}/ci-resources/assets-lock.json
            ${{ runner.temp }}/ci-resources/resources-manifest.json
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x86_64 Full
    needs: shared
    runs-on: windows-2022
    timeout-minutes: 70
    env:
      CARGO_TARGET_DIR: target/windows-full
      CARGO_ENCODED_RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.0'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/download-artifact@v6
        with:
          name: full-shared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-resources
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/windows-full
          key: full-windows-v1-rust1.99.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'vendor/**', 'web/locales/**', 'windows/app.ico') }}
          restore-keys: full-windows-v1-rust1.99.1-
      - name: Build native Full host; check Windows window registry and IPC
        shell: pwsh
        run: |
          $flags = @("--remap-path-prefix=$($pwd.Path)=fitsviewer-source", "--remap-path-prefix=$env:USERPROFILE/.cargo=cargo-source", '-Ctarget-feature=+crt-static')
          $env:CARGO_ENCODED_RUSTFLAGS = $flags -join [char]31
          cargo build --locked --release -p fitsviewer --no-default-features --features desktop,pro
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --release -p fitsviewer --no-default-features --features desktop,pro native_windows::tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v6
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/windows-full
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Stage and package wheel, portable and Setup
        shell: pwsh
        run: |
          python -m pip install hatchling==1.32.4
          $wheel = (Get-ChildItem "$env:RUNNER_TEMP/ci-resources/*.whl").FullName
          python scripts/stage_ci_platform.py --native target/windows-full/release/fitsviewer.exe --wheel $wheel --assets-lock "$env:RUNNER_TEMP/ci-resources/assets-lock.json" --output build/ci-windows --windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build_wheel.py --assets-dir build/ci-windows --windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build_windows_installer.py --wheel dist/full/fitsviewer-0.1.7-py3-none-win_amd64.whl --payload "$env:RUNNER_TEMP/windows-payload" --out dist/windows --iscc 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare isolated platform validation and CI-only OpenGL
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/validation-venv"
          & "$env:RUNNER_TEMP/validation-venv/Scripts/python.exe" -m pip install jupyterlab==4.6.4 jupyter-server-proxy==4.6.0 ipykernel psutil 'numpy>=2,<3' 'astropy>=6,<8'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix qa
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./qa/node_modules/.bin/playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile "$env:RUNNER_TEMP/mesa.7z"
          if ((Get-FileHash "$env:RUNNER_TEMP/mesa.7z").Hash.ToLower() -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695') { throw 'CI renderer hash differs' }
          7z x "$env:RUNNER_TEMP/mesa.7z" "-o$env:RUNNER_TEMP/mesa"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native render, Unicode, Jupyter proxy, Notebook and cleanup
        shell: pwsh
        run: |
          $env:FITSVIEWER_CI_MESA_DIR = "$env:RUNNER_TEMP/mesa/x64"
          & "$env:RUNNER_TEMP/validation-venv/Scripts/python.exe" scripts/verify_windows.py --wheel dist/full/fitsviewer-0.1.7-py3-none-win_amd64.whl --python "$env:RUNNER_TEMP/validation-venv/Scripts/python.exe" --scratch "$env:RUNNER_TEMP/windows-runtime-test"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_windows_setup.py --setup dist/windows/FitsViewer-0.1.7-windows-x86_64-setup.exe --python "$env:RUNNER_TEMP/validation-venv/Scripts/python.exe" --scratch "$env:RUNNER_TEMP/windows-setup-test" --payload "$env:RUNNER_TEMP/windows-payload"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v5
        with:
          name: full-windows-x86_64
          path: |
            dist/full/*.whl
            dist/windows/*.exe
            dist/windows/*.zip
            ${{ runner.temp }}/windows-runtime-test/validation.json
            ${{ runner.temp }}/windows-setup-test/validation.json
            reports/screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: windows-failure-evidence
          path: |
            ${{ runner.temp }}/windows-runtime-test/validation.json
            ${{ runner.temp }}/windows-runtime-test/native-*.json
            ${{ runner.temp }}/windows-setup-test/validation.json
            reports/screenshots/*.png
          if-no-files-found: ignore

  macos:
    name: macOS Full / ${{ matrix.arch }}
    needs: shared
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/download-artifact@v6
        with:
          name: full-shared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-resources
      - uses: actions/cache/restore@v6
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/macos-full
          key: macos-full-v1-${{ matrix.runner }}-rust1.99.1-macos11-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'vendor/**', 'windows/app.png', 'web/locales/**') }}
          restore-keys: macos-full-v1-${{ matrix.runner }}-rust1.99.1-macos11-
      - name: Build native app; reuse accepted Linux common tests
        run: python scripts/build_macos_full.py --assets-lock "$RUNNER_TEMP/ci-resources/assets-lock.json" --wheel "$(find "$RUNNER_TEMP/ci-resources" -maxdepth 1 -name '*.whl' -print -quit)" --execute --reuse-common-tests
      - uses: actions/cache/save@v6
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/macos-full
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - run: python -m pip install 'numpy>=2,<3' 'astropy>=6,<8'
      - name: Relocated Unicode app, signature, server, worker, GUI texture and cleanup
        run: python scripts/verify_macos_full.py --assets-lock "$RUNNER_TEMP/ci-resources/assets-lock.json" --package dist/macos --output reports/macos --probe-gui
      - uses: actions/upload-artifact@v5
        with:
          name: full-macos-${{ matrix.arch }}
          path: |
            dist/macos/*.zip
            dist/macos/*.sha256
            dist/macos/package.json
            reports/macos/
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: macos-failure-${{ matrix.arch }}
          path: |
            dist/macos/build.json
            reports/macos/
          if-no-files-found: ignore

  linux:
    name: Linux Full package from shared release resources
    needs: shared
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      CARGO_TARGET_DIR: target/linux-full
      FITSVIEWER_WHEEL_PLATFORM: manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/download-artifact@v6
        with:
          name: full-shared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-resources
      - name: Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
          python -m pip install hatchling==1.32.4 auditwheel==6.8.2 patchelf==0.19.1.0 cargo-zigbuild==0.23.4 ziglang==0.13.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/linux-full
          key: full-linux-v1-rust1.99.1-glibc2.28-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', 'vendor/**', 'web/locales/**') }}
          restore-keys: full-linux-v1-rust1.99.1-glibc2.28-
      - name: Build and repair Full wheel; do not repeat accepted science/UI tests
        shell: bash
        run: |
          export CARGO_ENCODED_RUSTFLAGS="$(printf '%s\037%s' "--remap-path-prefix=$PWD=fitsviewer-source" "--remap-path-prefix=$HOME/.cargo=cargo-source")"
          cargo zigbuild --locked --release --target x86_64-unknown-linux-gnu.2.28 -p fitsviewer --no-default-features --features desktop,pro
          python scripts/stage_ci_platform.py --native target/linux-full/x86_64-unknown-linux-gnu/release/fitsviewer --wheel "$(find "$RUNNER_TEMP/ci-resources" -maxdepth 1 -name '*.whl' -print -quit)" --assets-lock "$RUNNER_TEMP/ci-resources/assets-lock.json" --output build/ci-linux
          python scripts/build_wheel.py --assets-dir build/ci-linux --repair
          python scripts/verify_ci_linux_package.py --wheel dist/full/fitsviewer-0.1.7-py3-none-manylinux_2_28_x86_64.whl --assets-lock "$RUNNER_TEMP/ci-resources/assets-lock.json" --output reports/linux-package.json
      - uses: actions/upload-artifact@v5
        with:
          name: full-linux-x86_64
          path: |
            dist/full/*.whl
            reports/linux-package.json
          if-no-files-found: error
