[package]
name = "fitsviewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["desktop", "pro"]
desktop = ["dep:fitsviewer-web", "dep:eframe"]
pro = ["fitsviewer-web?/pro"]

[dependencies]
fitsviewer-core = { path = "../core" }
flate2 = "1"
fitsviewer-web = { path = "../viewer", default-features = false, optional = true }
eframe = { optional = true, version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "x11"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
ureq = { version = "2", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
