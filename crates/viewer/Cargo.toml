[package]
name = "fitsview-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fitsview-core = { path = "../core" }
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow"] }
ehttp = "0.5"
serde_json = "1"
urlencoding = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Location"] }
