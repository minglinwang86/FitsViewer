[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "fitsviewer"
version = "0.1.4rc2"
description = "fitsrs-powered FITS viewer integration for JupyterLab and notebooks"
readme = "README.md"
authors = [{name = "FitsViewer contributors"}]
maintainers = [{name = "FitsViewer contributors"}]
keywords = ["astronomy", "fits", "fitsrs", "jupyterlab", "rust", "viewer"]
requires-python = ">=3.10"
dependencies = ["jupyter-server-proxy>=4.4,<5", "jupyterlab>=4.4,<5", "ipython>=8"]
