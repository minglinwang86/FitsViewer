    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.scripts]
fitsviewer = "fitsviewer.cli:main"

[project.entry-points.jupyter_serverproxy_servers]
fitsviewer = "fitsviewer:setup_server"

[tool.hatch.build.targets.wheel]
packages = ["fitsviewer"]
exclude = ["fitsviewer/_vendor"]

[tool.hatch.build.targets.wheel.shared-data]
"fitsviewer/labextension" = "share/jupyter/labextensions/fitsviewer"
"jupyter-config" = "etc/jupyter"

[tool.hatch.build.targets.wheel.force-include]
"fitsviewer/_vendor" = "fitsviewer/_vendor"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project.urls]
Source = "https://github.com/minglinwang86/FitsViewer"
Issues = "https://github.com/minglinwang86/FitsViewer/issues"
Documentation = "https://github.com/minglinwang86/FitsViewer#readme"
