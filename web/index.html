<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FITSView</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117;color:#c9d1d9;font:13px system-ui,sans-serif}body{display:flex;flex-direction:column}.window-bar{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #30363d;background:#161b22}.window-bar span{color:#8b949e}.window-bar button{border:1px solid #3e5965;border-radius:4px;background:#20333c;color:#a8e1e9;padding:3px 9px;cursor:pointer}#stage{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block}#startup{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}</style></head>
<body><div class="window-bar"><span>FITSView · astronomical image viewer</span><button id="popout">Open in window ↗</button></div><div id="stage"><canvas id="fitsview-canvas"></canvas><div id="startup">Starting FITSView…</div></div>
<script type="module">
import init,{start,stop} from './pkg/fitsview_web.js';
let disposed=false,started=false,followTimer;
function releaseResources(){
  stop();
  const canvas=document.getElementById('fitsview-canvas');
  const gl=canvas?.getContext('webgl2')||canvas?.getContext('webgl');
  gl?.getExtension('WEBGL_lose_context')?.loseContext();
}
function dispose(){
  if(disposed)return;
  disposed=true;clearTimeout(followTimer);
  if(started)releaseResources();
  window.__fitsviewDisposed=true;
}
window.addEventListener('fitsview-dispose',dispose,{once:true});
window.addEventListener('pagehide',dispose,{once:true});
window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
// Keep right-drag available for colormap controls. / 图像画布右键用于亮度和对比度。
document.getElementById('fitsview-canvas').addEventListener('contextmenu',event=>event.preventDefault());
document.getElementById('popout').onclick=()=>{const url=new URL(location.href);url.searchParams.set('window','1');window.open(url.href,'FITSView','popup,width=1200,height=850,resizable=yes,scrollbars=no');};
try{await init();if(!disposed){const query=new URLSearchParams(location.search);const api=new URL('.',location.href).href.replace(/\/$/,'');await start(document.getElementById('fitsview-canvas'),api,query.get('path')||'',query.get('token')||'',query.has('hdu')?Number(query.get('hdu')):undefined);started=true;if(disposed)releaseResources();else document.getElementById('startup').remove();}}
catch(error){if(!disposed){document.getElementById('startup').textContent='Unable to start FITSView: '+error;console.error(error);}}
// An explicitly opened window can follow later SSH CLI requests on its own.
// 已打开的独立窗口可以直接响应后续 SSH 命令行请求。
if(!disposed&&new URLSearchParams(location.search).get('window')==='1'){
  let after=0,epoch='',initialized=false;
  async function follow(){if(disposed)return;try{const base=new URL('.',location.href);const url=new URL('api/requests',base);url.searchParams.set('after',String(after));const token=new URLSearchParams(location.search).get('token');if(token)url.searchParams.set('token',token);const response=await fetch(url);if(disposed)return;if(response.ok){const data=await response.json();if(!initialized||epoch!==data.epoch){initialized=true;epoch=data.epoch;after=data.latest;}else{const request=data.requests.at(-1);after=data.latest;if(request){const next=new URL(location.href);next.searchParams.set('path',request.path);if(request.hdu!==null&&request.hdu!==undefined)next.searchParams.set('hdu',request.hdu);else next.searchParams.delete('hdu');if(next.href!==location.href){location.replace(next.href);return;}}}}}catch{}if(!disposed)followTimer=setTimeout(follow,1500);}
  follow();
}
</script></body></html>
