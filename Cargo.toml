[workspace]
members = ["crates/core", "crates/viewer", "crates/server"]
exclude = ["vendor/fitsrs"]
resolver = "2"

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 2

[profile.release.package.fitsviewer-web]
opt-level = "s"

[patch.crates-io]
fitsrs = { path = "vendor/fitsrs" }
